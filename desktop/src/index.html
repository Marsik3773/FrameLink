<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob:; media-src blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="../assets/icons.css">
  <link rel="icon" href="../assets/icon.png">
  <title>FrameLink</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../assets/icon.png" alt="" width="40" height="40"><span>FrameLink</span></div>
    <div id="updateBar" hidden role="status"><span id="updateVersion"></span>
      <button id="updateInstall" type="button">Обновить</button><button id="updateSkip" type="button" class="subtle">Пропустить</button>
    </div>
    <div class="connection-status" id="connectionStatus" data-state="idle" role="status"><i></i><span id="statusText">Не подключено</span></div>
  </header>

  <main class="workspace">
    <section class="viewer">
      <div class="viewer-head">
        <h1>Предпросмотр</h1>
        <div class="viewer-actions">
          <button class="icon-button" type="button" id="mirror" title="Зеркало" aria-label="Зеркало" aria-pressed="false" disabled><i class="bi bi-symmetry-horizontal" aria-hidden="true"></i></button>
          <button class="icon-button" type="button" id="snapshot" title="Снимок PNG" aria-label="Снимок PNG" disabled><i class="bi bi-camera" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="stage" id="stage">
        <canvas id="canvas" hidden aria-label="Видео с камеры телефона"></canvas>
        <div id="transformArea" hidden><div id="selection" hidden></div></div>
        <div class="empty" id="empty">
          <i class="bi bi-camera-video" aria-hidden="true"></i>
          <h2 id="emptyTitle">Нет видео</h2>
          <p id="emptyHint" hidden></p>
        </div>
      </div>
      <div class="viewer-foot">
        <span id="videoStats"></span>
        <span id="effectStatus" role="status"></span>
        <span id="virtualState" data-live="false"><i class="bi bi-camera-video" aria-hidden="true"></i> <span id="virtualName">FrameLink Camera</span></span>
      </div>
      <p class="error" id="virtualError" role="alert" hidden></p>
    </section>

    <aside class="inspector" aria-label="Настройки">
      <section class="connect-card">
        <div class="section-head">
          <h2>Подключение</h2>
          <button class="icon-button" type="button" id="scanDevices" aria-label="Найти телефоны" title="Найти телефоны"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
        </div>
        <form id="connection">
          <div class="segmented" aria-label="Режим подключения">
            <label><input type="radio" name="transport" value="ip" checked>Wi-Fi</label>
            <label><input type="radio" name="transport" value="usb">USB</label>
          </div>
          <div id="discoveryResults" aria-live="polite">
            <ul id="devices" class="device-list"></ul>
            <p id="discoveryHint" class="muted" hidden></p>
          </div>
          <details id="manualAddress"><summary>По IP-адресу</summary><div class="addresses">
            <label class="field" id="hostField"><span>IP-адрес</span><input id="host" placeholder="192.168.1.24" spellcheck="false" autocomplete="off"></label>
            <label class="field"><span>Порт</span><input id="port" type="number" value="4747" min="1024" max="65535" inputmode="numeric" required></label>
          </div>
          </details>
          <p class="error" id="connectionError" role="alert" hidden></p>
          <button class="primary" id="connectButton" type="submit">Подключить</button>
        </form>
      </section>

      <section class="settings-card">
        <div class="tabbar" role="tablist" aria-label="Настройки">
          <button id="tab-layers" type="button" role="tab" aria-controls="layers-panel" aria-selected="true">Слои</button>
          <button id="tab-camera" type="button" role="tab" aria-controls="camera-panel" aria-selected="false" tabindex="-1">Камера</button>
          <button id="tab-effects" type="button" role="tab" aria-controls="effects-panel" aria-selected="false" tabindex="-1">Эффекты</button>
          <button class="tab-icon" id="tab-output" type="button" role="tab" aria-controls="output-panel" aria-label="Вывод" title="Вывод" aria-selected="false" tabindex="-1"><i class="bi bi-gear" aria-hidden="true"></i></button>
        </div>

        <section id="layers-panel" class="tab-content" role="tabpanel" aria-labelledby="tab-layers">
          <ul id="layerRows" class="layer-list" aria-label="Слои"></ul>
          <div class="layer-toolbar">
            <details id="layerAdd">
              <summary class="icon-button" aria-label="Добавить слой" title="Добавить слой"><i class="bi bi-plus-lg" aria-hidden="true"></i></summary>
              <div id="layerTypes" class="layer-menu">
                <button type="button" data-kind="image"><i class="bi bi-image" aria-hidden="true"></i>Изображение</button>
                <button type="button" data-kind="video"><i class="bi bi-film" aria-hidden="true"></i>Видео</button>
                <button type="button" data-kind="text"><i class="bi bi-type" aria-hidden="true"></i>Текст</button>
                <button type="button" data-kind="browser"><i class="bi bi-globe2" aria-hidden="true"></i>Браузер</button>
              </div>
            </details>
            <button class="icon-button" id="layerDelete" type="button" aria-label="Удалить слой" title="Удалить слой"><i class="bi bi-trash3" aria-hidden="true"></i></button>
            <button class="icon-button" id="layerUp" type="button" aria-label="Слой выше" title="Слой выше"><i class="bi bi-chevron-up" aria-hidden="true"></i></button>
            <button class="icon-button" id="layerDown" type="button" aria-label="Слой ниже" title="Слой ниже"><i class="bi bi-chevron-down" aria-hidden="true"></i></button>
          </div>
          <input id="layerFile" type="file" hidden>
          <fieldset id="layerEditor" hidden>
            <div id="layerMediaFields" hidden>
              <button class="subtle" type="button" id="layerFilePick"><i class="bi bi-folder2-open" aria-hidden="true"></i> Выбрать файл</button>
            </div>
            <div class="effect-group" id="layerTextFields" hidden>
              <label class="field"><span>Текст</span><textarea id="layer-text" rows="3" maxlength="1500"></textarea></label>
              <div class="two-controls">
                <label class="field"><span>Шрифт · px</span><input id="layer-font" type="number" min="8" max="200" required></label>
                <label class="field"><span>Цвет</span><input id="layer-color" type="color"></label>
              </div>
            </div>
            <div class="effect-group" id="layerBrowserFields" hidden>
              <div class="url-field">
                <label class="field"><span>URL страницы</span><input id="layer-url" type="url" placeholder="https://" maxlength="2048"></label>
                <button class="icon-button" type="button" id="browserLoad" aria-label="Загрузить страницу" title="Загрузить страницу"><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
              </div>
              <div class="two-controls">
                <label class="field"><span>Страница · ширина</span><input id="browserWidth" type="number" min="100" max="1280" required></label>
                <label class="field"><span>Страница · высота</span><input id="browserHeight" type="number" min="100" max="720" required></label>
              </div>
            </div>
            <div class="two-controls">
              <label class="field"><span>X · %</span><input id="layer-x" type="number" step="0.1" min="-400" max="400" required></label>
              <label class="field"><span>Y · %</span><input id="layer-y" type="number" step="0.1" min="-400" max="400" required></label>
              <label class="field"><span>Ширина · %</span><input id="layer-width" type="number" step="0.1" min="1" max="400" required></label>
              <label class="field"><span>Высота · %</span><input id="layer-height" type="number" step="0.1" min="1" max="400" required></label>
            </div>
            <label class="control slider"><span>Непрозрачность</span><input id="layer-opacity" type="range" min="0" max="100"></label>
            <p class="error" id="layerError" role="alert" hidden></p>
          </fieldset>
        </section>

        <section id="camera-panel" class="tab-content" role="tabpanel" aria-labelledby="tab-camera" hidden>
          <p class="muted" id="cameraHint">Нет подключения</p>
          <fieldset id="cameraFields" disabled hidden>
            <label class="control"><span>Объектив</span><select id="lens"><option value="rear">Основная</option><option value="front">Фронтальная</option></select></label>
            <div class="two-controls">
              <label class="control"><span>Разрешение</span><select id="resolution"><option value="360">360p</option><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select></label>
              <label class="control"><span>Частота кадров</span><select id="fps"><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label>
            </div>
            <label class="control slider"><span>Приближение <output id="zoomValue">1×</output></span><input id="zoom" type="range" min="100" max="400" value="100"></label>
            <label class="control"><span>Баланс белого</span><select id="wb"><option value="1">Авто</option></select></label>
            <label class="toggle" id="manualExposureRow"><input id="manualExposure" type="checkbox">Ручная экспозиция</label>
            <label class="control slider" id="evRow"><span>Экспокоррекция <output id="evValue">0 EV</output></span><input id="ev" type="range" min="-6" max="6" value="0"></label>
            <label class="control slider" id="shutterRow" hidden><span>Выдержка <output id="shutterValue"></output></span><input id="shutter" type="range"></label>
            <label class="control slider" id="isoRow" hidden><span>ISO <output id="isoValue"></output></span><input id="iso" type="range"></label>
            <label class="toggle" id="manualFocusRow"><input id="manualFocus" type="checkbox">Ручной фокус</label>
            <label class="control slider" id="focusRow" hidden><span>Фокус <output id="focusValue"></output></span><input id="focus" type="range"></label>
          </fieldset>
        </section>

        <section id="effects-panel" class="tab-content" role="tabpanel" aria-labelledby="tab-effects" hidden>
          <label class="control"><span>Фон</span><select id="effect">
            <option value="0">Оригинал</option>
            <option value="1">Хромакей</option>
            <option value="2">Вырезать человека</option>
            <option value="3">Размыть фон</option>
          </select></label>
          <div class="effect-group" id="chromaSettings" hidden>
            <label class="color-control"><span>Цвет хромакея</span><input id="keyColor" type="color" value="#00b140"></label>
            <label class="control slider"><span>Допуск</span><input id="tolerance" type="range" min="3" max="50" value="16"></label>
          </div>
          <label class="control slider" id="maskSettings" hidden><span>Граница силуэта</span><input id="maskThreshold" type="range" min="22" max="78" value="50"></label>
          <label class="control slider" id="blurSettings" hidden><span>Сила размытия</span><input id="blur" type="range" min="4" max="68" value="31"></label>
          <div id="backgroundSettings" class="effect-group" hidden>
            <div class="button-row"><button id="pickBackground" class="icon-button" type="button" title="Выбрать фон" aria-label="Выбрать фон"><i class="bi bi-folder2-open" aria-hidden="true"></i></button><button id="clearBackground" class="icon-button" type="button" title="Убрать фон" aria-label="Убрать фон" hidden><i class="bi bi-trash3" aria-hidden="true"></i></button></div>
            <input type="file" id="background" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp,video/mp4,video/webm" hidden>
            <p class="muted" id="backgroundName">Прозрачный фон</p>
          </div>
          <hr>
          <label class="control slider"><span>Яркость</span><input id="brightness" type="range" min="-35" max="35" value="0"></label>
          <label class="control slider"><span>Контраст</span><input id="contrast" type="range" min="45" max="155" value="100"></label>
          <label class="control slider"><span>Насыщенность</span><input id="saturation" type="range" min="0" max="185" value="100"></label>
          <label class="toggle"><input id="mono" type="checkbox">Чёрно-белое видео</label>
          <button class="icon-button" id="resetEffects" type="button" title="Сбросить эффекты" aria-label="Сбросить эффекты"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button>
        </section>

        <section id="output-panel" class="tab-content" role="tabpanel" aria-labelledby="tab-output" hidden>
          <h3>Видео</h3>
          <button id="cameraPrivacy" type="button" class="subtle">Доступ к камере в Windows</button>
          <button id="repairCamera" type="button" class="subtle">Восстановить камеру Windows</button>
          <p id="driverState" class="muted">Проверка камеры…</p>
          <div class="two-controls">
            <label class="control"><span>Разрешение вывода</span><select id="outputSize"><option value="640x360">640 × 360</option><option value="960x540">960 × 540</option><option value="1280x720" selected>1280 × 720</option><option value="1920x1080">1920 × 1080</option></select></label>
            <label class="control"><span>Частота кадров</span><select id="outputFps"><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label>
          </div>
          <hr>
          <h3>Микрофон телефона</h3>
          <p id="audioState" class="muted">Микрофон выключен</p>
          <label class="toggle"><input id="audioEnabled" type="checkbox">Воспроизвести на ПК</label>
          <label class="control"><span>Устройство вывода</span><select id="audioDevice"><option value="">Системное устройство</option></select></label>
          <label class="control slider"><span>Громкость</span><input id="volume" type="range" min="0" max="150" value="100"></label>
          <label class="control slider"><span>Задержка звука <output id="delayValue">0 мс</output></span><input id="audioDelay" type="range" min="0" max="500" step="10" value="0"></label>
          <meter id="audioLevel" min="0" max="1" value="0" aria-label="Уровень микрофона"></meter>
          <div class="button-row"><button type="button" class="subtle" id="adbLink">Android Platform Tools</button></div>
          <hr><h3>Обновления Windows</h3>
          <div class="button-row"><button type="button" id="checkUpdates" class="subtle">Проверить обновления</button></div>
          <p id="updateStatus" class="muted" role="status" hidden></p>
          <p class="error" id="audioError" role="alert" hidden></p>
        </section>
      </section>
    </aside>
  </main>
  <script type="module" src="studio.mjs"></script>
</body>
</html>
