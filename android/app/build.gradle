plugins { id 'com.android.application' }
android {
    namespace 'app.framelink.camera'
    compileSdk 35
    defaultConfig {
        applicationId 'app.framelink.camera'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (System.getenv('FRAMELINK_KEYSTORE')) {
            distribution {
                storeFile file(System.getenv('FRAMELINK_KEYSTORE'))
                storePassword System.getenv('FRAMELINK_STORE_PASSWORD')
                keyAlias System.getenv('FRAMELINK_KEY_ALIAS')
                keyPassword System.getenv('FRAMELINK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('FRAMELINK_KEYSTORE')) signingConfig signingConfigs.distribution
        }
    }
}
